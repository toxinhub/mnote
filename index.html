elative;display:block;aspect-ratio:16/9;width:100%;overflow:hidden;background:linear-gradient(135deg,#2f7d79,#a6c9bc)}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#101a1a4a,transparent 65%);pointer-events:none}.play{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:39px;height:39px;border-radius:50%;background:#101a1aab;color:white;font-size:15px}.cardBody{padding:12px 14px 11px}.card h3{font-size:16px;line-height:1.35;margin:0 28px 3px 0;overflow-wrap:anywhere}.artist{font-size:12px;color:var(--mute);margin-bottom:8px}.feeling{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.tag{border-radius:12px;background:#75868b22;padding:2px 9px;font-size:12px}.pin{position:absolute;right:7px;top:7px;z-index:3;width:33px;height:33px;border-radius:50%;background:#10201f80;color:#fff;opacity:0}.card:hover .pin,.pin.on,.card:focus-within .pin{opacity:1}.pin.on{background:var(--acc);color:var(--accink)}.cardActs{display:flex;gap:2px;align-items:center;margin:6px -4px -4px;opacity:0;transition:opacity .15s}.card:hover .cardActs,.card:focus-within .cardActs{opacity:1}.cardActs .icon{width:34px;height:34px;font-size:16px}.empty{text-align:center;color:var(--mute);padding:70px 10px}.emptyIcon{font-size:58px;opacity:.6}.empty h3{font-size:18px;font-weight:500;color:var(--ink);margin:8px 0}.empty p{font-size:13px;margin:0}

n-width:57px;min-height:48px;border-radius:14px;font-size:10px;color:var(--mute)}.mobileNav .navglyph{font-size:20px;line-height:1.3;padding:0 13px;border-radius:18px}.mobileNav button.active{color:var(--ink);font-weight:600}.mobileNav button.active .navglyph{background:var(--c2)}.empty{padding:48px 8px}.emptyIcon{font-size:48px}}
@media(max-width:360px){.logo b{display:none}.grid{columns:2 120px;column-gap:7px}.cardBody{padding:8px}.card h3{font-size:13px}.search input{font-size:13px}}

<body>
<header>
<button class="menu" id="menu" aria-label="মেনু">☰</button>
<div class="logo"><i>♪</i><b>সুরখাতা</b></div>
<label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="গান, ট্যাগ বা অনুভূতি খুঁজুন" autocomplete="off"></label>
<div class="tools"><button class="icon" id="refresh" title="রিফ্রেশ" aria-label="রিফ্রেশ">⟳</button><button class="icon" id="theme" title="থিম বদলান" aria-label="থিম বদলান">◐</button></div>
</header>
<div class="main">
<aside id="sidebar">
<button class="navitem active" data-view="all"><span class="ico">♫</span><span>সব গান</span><span class="cnt" id="allCount"></span></button>
<button class="navitem" data-view="pinned"><span class="ico">♧</span><span>পিন করা</span><span class="cnt" id="pinCount"></span></button>
<button class="navitem" data-view="reminders"><span class="ico">◷</span><span>প্রিয় মুহূর্ত</span></button>
<button class="navitem" data-view="archive"><span class="ico">▤</span><span>আর্কাইভ</span></button>
<button class="navitem" data-view="trash"><span class="ico">▥</span><span>ট্র্যাশ</span></button>
<div class="sideTitle"><span>ট্যাগ / লেবেল</span><button class="icon" id="clearLabel" title="লেবেল ফিল্টার সরান">＋</button></div>
<div id="labels"></div>
<div class="sideFoot">গান, অনুভূতি আর স্মৃতি—এক জায়গায়।<br><br><a href="admin.html">অ্যাডমিন লগইন ↗</a></div>
</aside>
<main>
<p class="hint" id="hint">আপনার প্রিয় গান ও সেই গান ঘিরে থাকা স্মৃতিগুলো এখানে রাখুন।</p>
<section class="composer" id="composer">
<div class="composeHead"><input id="quickTitle" placeholder="একটি গান বা স্মৃতি লিখুন..." maxlength="180" aria-label="গানের শিরোনাম"><div class="composeActions"><button class="icon" id="expand" title="আরও তথ্য যোগ করুন">＋</button><button class="icon" id="quickLink" title="YouTube লিংক যোগ করুন">▶</button></div></div>
<div class="composeMore" id="composeMore">
<div class="fields">
<input class="field" id="quickArtist" placeholder="শিল্পী / ব্যান্ড">
<input class="field" id="quickUrl" type="url" placeholder="YouTube লিংক (ঐচ্ছিক)">
<textarea class="field" id="quickIdea" placeholder="এই গানটি কেন মনে রাখতে চান? অনুভূতি, স্মৃতি বা নোট লিখুন..."></textarea>
<input class="field" id="quickMood" placeholder="মুড / অনুভূতি">
<input class="field" id="quickTags" placeholder="ট্যাগ (কমা দিয়ে আলাদা করুন)">
<input class="field" id="quickStart" placeholder="প্রিয় মুহূর্ত (যেমন ১:২৩)">
</div>
<div class="composeFoot"><small>জমা দেওয়ার পর অ্যাডমিন অনুমোদন করলে নোটটি প্রকাশিত হবে।</small><button class="btn" id="closeCompose">বাতিল</button><button class="btn primary" id="quickSave">জমা দিন</button></div>
</div></section>
<div class="sectionLabel" id="sectionLabel">আপনার গানের নোট</div>
<div class="grid" id="grid" aria-live="polite"><div class="empty"><div class="emptyIcon">♫</div><h3>গানগুলো লোড হচ্ছে</h3></div></div>
</main>
</div>
<nav class="mobileNav" aria-label="মোবাইল নেভিগেশন"><button class="active" data-view="all"><span class="navglyph">♫</span><span>সব গান</span></button><button data-view="pinned"><span class="navglyph">♧</span><span>পিন</span></button><button id="mobileAdd"><span class="navglyph">＋</span><span>নতুন</span></button><button data-view="archive"><span class="navglyph">▤</span><span>আর্কাইভ</span></button><button data-view="trash"><span class="navglyph">▥</span><span>ট্র্যাশ</span></button></nav>
<div class="overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-label="গানের বিস্তারিত"><div class="modal" id="detail"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const db=window.supabase.createClient('https://ekaxlxudxpkkozbyslub.supabase.co','sb_publishable_sT0mSJ1Rp2J5PeLhBZGJFg_dAeS9xfD');
const $=id=>document.getElementById(id);
const COLORS=['white','rose','sand','sage','sky','lilac'];
const BG={white:'var(--c6)',rose:'var(--c1)',sand:'var(--c2)',sage:'var(--c3)',sky:'var(--c4)',lilac:'var(--c5)'};
let entries=[],view='all',label='',pins=new Set(JSON.parse(localStorage.getItem('mnote:pinned')||'[]')),archived=new Set(JSON.parse(localStorage.getItem('mnote:archived')||'[]')),trashed=new Set(JSON.parse(localStorage.getItem('mnote:trash')||'[]')),composerOpen=false;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tags=e=>Array.isArray(e.tags)?e.tags.map(String):String(e.tags||'').split(',').map(x=>x.trim()).filter(Boolean);
function videoId(v=''){try{const u=new URL(v);if(u.hostname==='youtu.be'||u.hostname.endsWith('.youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]||''}}catch{}return ''}
const thumb=id=>'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg';
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2400)}
function showComposer(){composerOpen=true;$('composer').classList.add('open');$('quickTitle').focus()}
function hideComposer(){composerOpen=false;$('composer').classList.remove('open');['quickTitle','quickArtist','quickUrl','quickIdea','quickMood','quickTags','quickStart'].forEach(id=>$(id).value='')}
function visibleEntries(){return entries.filter(e=>{const id=String(e.id),inTrash=trashed.has(id),inArchive=archived.has(id);if(view==='trash')return inTrash;if(view==='archive')return inArchive&&!inTrash;if(inTrash||inArchive)return false;if(view==='pinned')return pins.has(id);if(view==='reminders')return !!String(e.start_time||'').trim();return true})}
function card(e,i){const id=videoId(e.song_url||''),ts=tags(e),arch=archived.has(String(e.id)),trash=trashed.has(String(e.id));return '<article class="card" data-id="'+esc(e.id)+'" data-c="'+((i%5)+1)+'" tabindex="0">'+(id?'<a class="thumb" href="'+esc(e.song_url)+'" target="_blank" rel="noopener noreferrer" aria-label="YouTube-এ চালান"><img loading="lazy" src="'+thumb(id)+'" alt="'+esc(e.title)+'" onerror="this.style.display=\'none\'"><span class="play">▶</span></a>':'')+'<button class="pin '+(pins.has(String(e.id))?'on':'')+'" data-pin="'+esc(e.id)+'" title="পিন" aria-label="পিন">'+(pins.has(String(e.id))?'📌':'♧')+'</button><div class="cardBody"><h3>'+esc(e.title||'নামহীন গান')+'</h3><div class="artist">'+esc(e.artist||'শিল্পীর নাম নেই')+'</div>'+(e.idea?'<p class="feeling">'+esc(e.idea)+'</p>':'')+(e.mood?'<div class="tags"><span class="tag">'+esc(e.mood)+'</span></div>':'')+(ts.length?'<div class="tags">'+ts.map(t=>'<button class="tag" data-tag="'+esc(t)+'"># '+esc(t)+'</button>').join('')+'</div>':'')+'<div class="cardActs"><button class="icon" data-copy="'+esc(e.id)+'" title="লিংক কপি">↗</button><button class="icon" data-pin="'+esc(e.id)+'" title="পিন">'+(pins.has(String(e.id))?'📌':'♧')+'</button>'+(trash?'<button class="icon" data-restore="'+esc(e.id)+'" title="ফিরিয়ে আনুন">↶</button><button class="icon" data-delete="'+esc(e.id)+'" title="ট্র্যাশ থেকে সরান">×</button>':arch?'<button class="icon" data-unarchive="'+esc(e.id)+'" title="আর্কাইভ থেকে সরান">▣</button>':'<button class="icon" data-archive="'+esc(e.id)+'" title="আর্কাইভ">▤</button><button class="icon" data-trash="'+esc(e.id)+'" title="ট্র্যাশে পাঠান">♲</button>')+'</div></div></article>'}
function render(){let list=visibleEntries();if(label)list=list.filter(e=>tags(e).some(t=>t.toLowerCase()===label.toLowerCase()));const q=$('search').value.trim().toLowerCase();if(q)list=list.filter(e=>[e.title,e.artist,e.idea,e.mood,e.start_time,...tags(e)].join(' ').toLowerCase().includes(q));if(view==='all'&&!q&&!label)list.sort((a,b)=>Number(pins.has(String(b.id)))-Number(pins.has(String(a.id))));const titles={all:'আপনার গানের নোট',pinned:'পিন করা গান',reminders:'প্রিয় মুহূর্ত',archive:'আর্কাইভ',trash:'ট্র্যাশ'};$('sectionLabel').textContent=q?'সার্চের ফলাফল':label?'# '+label:(titles[view]||titles.all);$('allCount').textContent=entries.filter(e=>!archived.has(String(e.id))&&!trashed.has(String(e.id))).length||'';$('pinCount').textContent=pins.size||'';$('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><div class="emptyIcon">'+(view==='trash'?'▥':view==='archive'?'▤':'♫')+'</div><h3>'+({pinned:'এখনো কোনো গান পিন করা হয়নি',reminders:'প্রিয় মুহূর্ত যোগ করা গান নেই',archive:'আর্কাইভ খালি',trash:'ট্র্যাশ খালি'}[view]||(q?'কোনো মিল পাওয়া যায়নি':'এখানে এখনো কোনো গান নেই'))+'</h3><p>'+(q?'অন্য শব্দ দিয়ে খুঁজে দেখুন।':'নতুন গান যোগ করে আপনার সুরের স্মৃতি জমাতে শুরু করুন।')+'</p></div>';const all=[...new Set(entries.flatMap(tags))].sort((a,b)=>a.localeCompare(b,'bn'));$('labels').innerHTML=all.map(t=>'<button class="navitem '+(label===t?'active':'')+'" data-label="'+esc(t)+'"><span class="ico">#</span><span>'+esc(t)+'</span></button>').join('');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
async function load(){ $('grid').innerHTML='<div class="empty"><div class="emptyIcon">♫</div><h3>গানগুলো লোড হচ্ছে</h3></div>';const {data,error}=await db.from('entries').select('*').eq('status','approved').order('updated_at',{ascending:false}).limit(500);if(error){$('grid').innerHTML='<div class="empty"><div class="emptyIcon">♪</div><h3>গান লোড করা যায়নি</h3><p>'+esc(error.message)+'</p><button class="btn primary" id="retry">আবার চেষ্টা করুন</button></div>';return}entries=data||[];render()}
function detail(id){const e=entries.find(x=>String(x.id)===String(id));if(!e)return;const vid=videoId(e.song_url||''),ts=tags(e);$('detail').innerHTML='<div class="modalBody"><div class="modalTop"><h2>'+esc(e.title||'নামহীন গান')+'</h2><button class="icon" id="detailClose" aria-label="বন্ধ করুন">×</button></div><div class="modalArtist">'+esc(e.artist||'শিল্পীর নাম নেই')+'</div>'+(vid?'<a class="detailHero" href="'+esc(e.song_url)+'" target="_blank" rel="noopener"><img src="'+thumb(vid)+'" alt="'+esc(e.title)+'"><span class="play">▶</span></a>':'')+(e.idea?'<div class="detailSection"><b>অনুভূতি ও স্মৃতি</b>'+esc(e.idea)+'</div>':'')+(e.start_time?'<div class="detailSection"><b>প্রিয় মুহূর্ত</b>'+esc(e.start_time)+'</div>':'')+(e.mood?'<div class="detailSection"><b>মুড</b>'+esc(e.mood)+'</div>':'')+(ts.length?'<div class="tags">'+ts.map(t=>'<button class="tag" data-tag="'+esc(t)+'"># '+esc(t)+'</button>').join('')+'</div>':'')+'<div class="modalBtns">'+(e.song_url?'<a class="btn primary" href="'+esc(e.song_url)+'" target="_blank" rel="noopener">▶ YouTube</a><a class="btn" href="https://music.youtube.com/watch?v='+encodeURIComponent(vid)+'" target="_blank" rel="noopener">YouTube Music</a>':'')+'<button class="btn" id="detailCopy">লিংক কপি</button></div></div>';document.querySelectorAll('#detail [data-tag]').forEach(b=>b.onclick=()=>{label=b.dataset.tag;view='all';modal(false);render()});$('detailClose').onclick=()=>modal(false);$('detailCopy').onclick=()=>copyLink(e.song_url||location.href);modal(true)}
function modal(open){$('detailOverlay').classList.toggle('show',open);document.body.style.overflow=open?'hidden':''}
async function save(){const title=$('quickTitle').value.trim(),url=$('quickUrl').value.trim(),vid=videoId(url),idea=$('quickIdea').value.trim();if(!title){toast('গানের নাম লিখুন');$('quickTitle').focus();return}if(url&&!vid){toast('সঠিক YouTube লিংক দিন');return}if(!idea){toast('গানটি সম্পর্কে একটি নোট লিখুন');$('quickIdea').focus();return}const payload={title,artist:$('quickArtist').value.trim(),song_url:vid?'https://www.youtube.com/watch?v='+vid:'',platform:'YouTube',idea,mood:$('quickMood').value.trim(),tags:$('quickTags').value.trim(),start_time:$('quickStart').value.trim(),progress:'Idea',status:'pending'};const {error}=await db.from('entries').insert(payload);if(error){toast('জমা দেওয়া যায়নি: '+error.message);return}hideComposer();toast('জমা হয়েছে—অ্যাডমিন অনুমোদনের অপেক্ষায়');}
function copyLink(url){if(!url){toast('কপি করার মতো লিংক নেই');return}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>toast('লিংক কপি হয়েছে')).catch(()=>toast('লিংক কপি করা যায়নি'));else{const a=document.createElement('textarea');a.value=url;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('লিংক কপি হয়েছে')}}
function setView(v){view=v;label='';$('sidebar').classList.remove('open');render()}
$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('search').oninput=render;$('refresh').onclick=load;$('expand').onclick=showComposer;$('quickTitle').onclick=()=>{if(!composerOpen)showComposer()};$('quickLink').onclick=()=>{showComposer();$('quickUrl').focus()};$('mobileAdd').onclick=showComposer;$('closeCompose').onclick=hideComposer;$('quickSave').onclick=save;$('clearLabel').onclick=()=>{label='';render()};document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('theme').onclick=()=>{const d=document.documentElement,now=d.getAttribute('data-theme')||'light',next=now==='dark'?'light':'dark';d.setAttribute('data-theme',next);localStorage.setItem('mnote:theme',next)};const savedTheme=localStorage.getItem('mnote:theme');if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
document.addEventListener('click',e=>{const tag=e.target.closest('[data-tag]');if(tag){label=tag.dataset.tag;view='all';render();return}const pin=e.target.closest('[data-pin]');if(pin){e.stopPropagation();const id=String(pin.dataset.pin);pins.has(id)?pins.delete(id):pins.add(id);localStorage.setItem('mnote:pinned',JSON.stringify([...pins]));render();return}const ar=e.target.closest('[data-archive]');if(ar){e.stopPropagation();const id=String(ar.dataset.archive);archived.add(id);trashed.delete(id);localStorage.setItem('mnote:archived',JSON.stringify([...archived]));localStorage.setItem('mnote:trash',JSON.stringify([...trashed]));render();toast('আর্কাইভে রাখা হয়েছে');return}const ua=e.target.closest('[data-unarchive]');if(ua){e.stopPropagation();archived.delete(String(ua.dataset.unarchive));localStorage.setItem('mnote:archived',JSON.stringify([...archived]));render();toast('গানটি আবার মূল তালিকায় এসেছে');return}const tr=e.target.closest('[data-trash]');if(tr){e.stopPropagation();const id=String(tr.dataset.trash);trashed.add(id);archived.delete(id);localStorage.setItem('mnote:trash',JSON.stringify([...trashed]));localStorage.setItem('mnote:archived',JSON.stringify([...archived]));render();toast('ট্র্যাশে পাঠানো হয়েছে');return}const rs=e.target.closest('[data-restore]');if(rs){e.stopPropagation();trashed.delete(String(rs.dataset.restore));localStorage.setItem('mnote:trash',JSON.stringify([...trashed]));render();toast('ফিরিয়ে আনা হয়েছে');return}const del=e.target.closest('[data-delete]');if(del){e.stopPropagation();if(confirm('এই ডিভাইসের ট্র্যাশ তালিকা থেকে সরাবেন?')){const id=String(del.dataset.delete);trashed.delete(id);archived.delete(id);localStorage.setItem('mnote:trash',JSON.stringify([...trashed]));localStorage.setItem('mnote:archived',JSON.stringify([...archived]));render();toast('ট্র্যাশ তালিকা থেকে সরানো হয়েছে')}return}const cp=e.target.closest('[data-copy]');if(cp){e.stopPropagation();const en=entries.find(x=>String(x.id)===String(cp.dataset.copy));copyLink(en&&en.song_url);return}if(e.target.id==='retry'){load();return}if(e.target=== $('detailOverlay'))modal(false);const c=e.target.closest('.card');if(c&&!e.target.closest('a,button'))detail(c.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal(false);$('sidebar').classList.remove('open');if(composerOpen)hideComposer()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}if(e.key==='n'&&!e.ctrlKey&&!e.metaKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();showComposer()}if(e.key==='Enter'&&e.target.classList.contains('card'))detail(e.target.dataset.id)});
load();
})();
</script>
</body>
