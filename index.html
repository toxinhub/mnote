function render(){const list=getVisible(),q=$('search').value.trim(),titles={all:'Notes',pinned:'Pinned',reminders:'Favorite Moments',archive:'Archive',trash:'Trash'};$('sectionTitle').textContent=q?'Search results':label?'# '+label:(titles[view]||'Notes');$('resultCount').textContent=list.length?list.length+(list.length===1?' note':' notes'):'';$('allCount').textContent=entries.filter(function(e){return!archived.has(String(e.id))&&!trashed.has(String(e.id))}).length||'';$('pinCount').textContent=pins.size||'';if(!list.length){const title=q?'No notes found':label?'No notes with this label yet':({pinned:'Nothing pinned yet',reminders:'No favorite moments yet',archive:'Your archive is empty',trash:'Your trash is empty'}[view]||'No notes here just yet');const desc=q?'Try searching with different words.':view==='trash'?'Songs you move to Trash will show up here.':'Add a song note and start collecting the memories behind your music.';$('notesGrid').innerHTML='<div class="empty"><div class="empty-icon">♫</div><strong>'+esc(title)+'</strong><p>'+esc(desc)+'</p></div>'}else $('notesGrid').innerHTML=list.map(card).join('');layoutNotesGrid();const labels=Array.from(new Set(entries.reduce(function(a,e){return a.concat(getTags(e))},[]))).sort(function(a,b){return a.localeCompare(b,'bn')});$('labels').innerHTML=labels.map(function(t){return'<button class="nav '+(label===t?'active':'')+'" data-label="'+esc(t)+'"><span class="nav-icon">#</span><span class="nav-label">'+esc(t)+'</span></button>'}).join('');document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});$('clearSearch').classList.toggle('hidden',!q)}
async function load(){$('notesGrid').innerHTML='<div class="empty"><div class="empty-icon">♫</div><strong>Loading your songs...</strong></div>';const r=await db.from('entries').select('*').eq('status','approved').order('updated_at',{ascending:false}).limit(500);if(r.error){$('notesGrid').innerHTML='<div class="empty"><div class="empty-icon">♪</div><strong>Couldn’t load your notes</strong><p>'+esc(r.error.message)+'</p><button class="text-btn primary" id="retry">Try again</button></div>';return}entries=r.data||[];render()}
function toggleModal(on,fromPop){if(on&&!$('detailOverlay').classList.contains('show')){detailHistory=true;history.pushState({mnoteDetail:true},'',location.href)}$('detailOverlay').classList.toggle('show',on);document.body.style.overflow=on?'hidden':'';if(!on){activeDetail=null;const shouldGoBack=!fromPop&&detailHistory&&history.state&&history.state.mnoteDetail;detailHistory=false;if(shouldGoBack)history.back()}}
function palette(id,selected){return'<div class="palette" aria-label="Note color">'+COLORS.map(function(c){return'<button class="swatch" data-set-color="'+esc(id)+'" data-color="'+c+'" title="'+COLOR_NAMES[c]+'" aria-label="'+COLOR_NAMES[c]+'" aria-pressed="'+(selected===c)+'"></button>'}).join('')+'</div>'}
function openDetail(id){const e=entries.find(function(x){return String(x.id)===String(id)});if(!e)return;activeDetail=String(id);const vid=videoId(e.song_url||''),ts=getTags(e),color=noteColors[String(e.id)]||'default';let h='<div class="dialog-body"><div class="detail-hero"><div class="detail-hero-top"><span class="detail-kicker"><span class="detail-kicker-icon">♫</span> SONG JOURNAL</span><button class="round" id="closeDetail" aria-label="Close">×</button></div><h2>'+esc(e.title||'Untitled song')+'</h2></div>';if(vid)h+='<a class="dialog-video" href="'+esc(e.song_url)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+thumbnail(vid)+'" alt="'+esc(e.title)+'"><span class="play">▶</span></a>';if(e.idea)h+='<div class="detail-section memory-section"><label>Feelings & memories</label>'+esc(e.idea)+'</div>';if(e.start_time)h+='<div class="detail-section moment-section"><label>Favorite moment</label>'+esc(e.start_time)+'</div>';if(e.mood)h+='<div class="detail-section mood-section"><label>Mood</label>'+esc(e.mood)+'</div>';if(ts.length)h+='<div class="tags">'+ts.map(function(t){return'<button class="tag" data-tag="'+esc(t)+'"># '+esc(t)+'</button>'}).join('')+'</div>';h+=palette(String(e.id),color)+'</div><div class="dialog-actions">'+(e.song_url?'<a class="text-btn action-chip youtube-chip" href="'+esc(e.song_url)+'" target="_blank" rel="noopener noreferrer" title="Open on YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>YouTube</a><a class="text-btn action-chip music-chip" href="https://music.youtube.com/watch?v='+encodeURIComponent(vid)+'" target="_blank" rel="noopener noreferrer" title="Open YouTube Music"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M10 7.8 17 12l-7 4.2Z" fill="var(--page,#fff)"/></svg>Music</a>':'')+'<button class="text-btn action-chip" id="detailCopy" title="Copy song link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l3-3A5 5 0 0 0 13 2.9l-1.7 1.7M14 11a5 5 0 0 0-7.1 0l-3 3A5 5 0 0 0 11 21.1l1.7-1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Copy</button><button class="text-btn action-chip" id="detailPin" title="'+(pins.has(String(e.id))?'Unpin note':'Pin note')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 0-1 6 3 3v2H6v-2l3-3-1-6ZM12 14v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>'+(pins.has(String(e.id))?'Unpin':'Pin')+'</button><button class="text-btn action-chip archive-chip" id="detailArchive" title="Archive note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v4H3zM5 9v11h14V9m-9 4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>Archive</button></div>';$('detailDialog').innerHTML=h;$('detailDialog').dataset.noteColor=color;$('closeDetail').onclick=function(){toggleModal(false)};$('detailCopy').onclick=function(){copyLink(e.song_url||location.href)};$('detailPin').onclick=function(){togglePin(String(e.id));$('detailPin').textContent=pins.has(String(e.id))?'Unpin':'Pin';render()};$('detailArchive').onclick=function(){archiveNote(String(e.id));toggleModal(false)};$('detailDialog').querySelectorAll('[data-tag]').forEach(function(b){b.onclick=function(){label=b.dataset.tag;view='all';toggleModal(false);render()}});toggleModal(true)}
async function saveNote(){const title=$('quickTitle').value.trim(),url=$('quickUrl').value.trim(),vid=videoId(url),idea=$('quickIdea').value.trim(),tags=$('quickTags').value.trim(),startTime=$('quickStart').value.trim();if(!title&&!url&&!idea&&!tags&&!startTime){toast('Add at least one detail before submitting');return}const payload={title:title,artist:'',song_url:vid?'https://www.youtube.com/watch?v='+vid:url,platform:vid?'YouTube':(url?'Link':''),idea:idea,mood:'',tags:tags,start_time:startTime,progress:'Idea',status:'pending'};$('saveNote').disabled=true;$('saveNote').textContent='Submitting…';const r=await db.from('entries').insert(payload);$('saveNote').disabled=false;$('saveNote').textContent='Submit note';if(r.error){toast('Couldn’t submit your note: '+r.error.message);return}hideComposer();toast('Your note is submitted and waiting for admin approval.')}
function copyLink(url){if(!url){toast('There’s no link to copy');return}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast('Link copied')}).catch(function(){fallbackCopy(url)});else fallbackCopy(url)}
function fallbackCopy(url){const el=document.createElement('textarea');el.value=url;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Link copied')}catch(e){toast('Couldn’t copy the link')}el.remove()}
function togglePin(id){if(pins.has(id))pins.delete(id);else pins.add(id);saveSet('mnote:pinned',pins);render()}
function archiveNote(id){archived.add(id);trashed.delete(id);saveSet('mnote:archived',archived);saveSet('mnote:trash',trashed);render();toast('Moved to Archive')}
function closeSidebar(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('show')}
function setView(v){view=v;label='';closeSidebar();render()}
function menuToggle(){if(matchMedia('(max-width:760px)').matches){$('sidebar').classList.toggle('open');$('backdrop').classList.toggle('show',$('sidebar').classList.contains('open'))}else $('app').classList.toggle('mini')}
function setColor(id,color){if(color==='default')delete noteColors[id];else noteColors[id]=color;saveObject('mnote:colors',noteColors);render();if(activeDetail===id)openDetail(id);else toast('Note color updated')}
$('quickUrl').addEventListener('input',function(){lookupSongTitle(this.value)});$('menuBtn').onclick=menuToggle;$('backdrop').onclick=closeSidebar;$('search').oninput=render;$('clearSearch').onclick=function(){$('search').value='';render();$('search').focus()};$('refresh').onclick=load;$('expand').onclick=showComposer;$('quickTitle').onclick=function(){if(!composerOpen)showComposer()};$('quickLink').onclick=function(){showComposer();$('quickUrl').focus()};$('mobileAdd').onclick=showComposer;$('mobileCreate').onclick=showComposer;$('closeComposer').onclick=hideComposer;$('saveNote').onclick=saveNote;$('clearLabel').onclick=function(){label='';render()};
function syncThemeButton(){const dark=document.documentElement.getAttribute('data-theme')==='dark';const btn=$('themeBtn');btn.querySelector('.theme-icon').textContent=dark?'☀':'☾';btn.title=dark?'Switch to light mode':'Switch to dark mode';btn.setAttribute('aria-label',btn.title)}
 $('themeBtn').onclick=function(){const dark=document.documentElement.getAttribute('data-theme')==='dark';if(dark)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','dark');try{localStorage.setItem('mnote:theme',dark?'light':'dark')}catch(e){}syncThemeButton()};
try{if(localStorage.getItem('mnote:theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}syncThemeButton();
document.addEventListener('click',function(ev){const v=ev.target.closest('[data-view]');if(v){setView(v.dataset.view);return}const lb=ev.target.closest('[data-label]');if(lb){label=lb.dataset.label;view='all';closeSidebar();render();return}const tg=ev.target.closest('[data-tag]');if(tg){label=tg.dataset.tag;view='all';toggleModal(false);render();return}const pin=ev.target.closest('[data-pin]');if(pin){ev.preventDefault();ev.stopPropagation();togglePin(String(pin.dataset.pin));return}const co=ev.target.closest('[data-color-open]');if(co){ev.preventDefault();ev.stopPropagation();openDetail(String(co.dataset.colorOpen));return}const sc=ev.target.closest('[data-set-color]');if(sc){ev.preventDefault();setColor(String(sc.dataset.setColor),sc.dataset.color);return}const ar=ev.target.closest('[data-archive]');if(ar){ev.preventDefault();ev.stopPropagation();archiveNote(String(ar.dataset.archive));return}const ua=ev.target.closest('[data-unarchive]');if(ua){ev.preventDefault();ev.stopPropagation();archived.delete(String(ua.dataset.unarchive));saveSet('mnote:archived',archived);render();toast('Moved back to Notes');return}const tr=ev.target.closest('[data-trash]');if(tr){ev.preventDefault();ev.stopPropagation();const id=String(tr.dataset.trash);trashed.add(id);archived.delete(id);saveSet('mnote:trash',trashed);saveSet('mnote:archived',archived);render();toast('Moved to Trash');return}const rs=ev.target.closest('[data-restore]');if(rs){ev.preventDefault();ev.stopPropagation();trashed.delete(String(rs.dataset.restore));saveSet('mnote:trash',trashed);render();toast('Note restored');return}const del=ev.target.closest('[data-delete]');if(del){ev.preventDefault();ev.stopPropagation();if(confirm('Remove this note from this device’s Trash list?')){const id=String(del.dataset.delete);trashed.delete(id);archived.delete(id);saveSet('mnote:trash',trashed);saveSet('mnote:archived',archived);render();toast('Removed from this device’s Trash list')}return}const cp=ev.target.closest('[data-copy]');if(cp){ev.preventDefault();ev.stopPropagation();const e=entries.find(function(x){return String(x.id)===String(cp.dataset.copy)});copyLink(e&&e.song_url);return}const op=ev.target.closest('[data-open]');if(op&&!ev.target.closest('a')&&(!ev.target.closest('button')||ev.target.closest('[data-open]'))){openDetail(String(op.dataset.open));return}if(ev.target===$('detailOverlay'))toggleModal(false);if(ev.target.id==='retry')load()});
window.addEventListener('popstate',function(){if($('detailOverlay').classList.contains('show')){toggleModal(false,true);return}if(composerOpen){hideComposer(true);return}if(composerHistory)composerHistory=false;detailHistory=false});
 document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){toggleModal(false);closeSidebar();if(composerOpen)hideComposer()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();$('search').focus()}if(ev.key==='n'&&!ev.ctrlKey&&!ev.metaKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ev.preventDefault();showComposer()}if(ev.key==='Enter'&&ev.target.classList.contains('note'))openDetail(ev.target.dataset.id)});
load();
})();
