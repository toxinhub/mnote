function cleanSongMetadataTitle(rawTitle,rawArtist){

 const split=title.match(/^(.{2,70}?)\s+[-–—]\s+(.{2,100})$/);
 if(split&&!/^(?:feat\.?|ft\.?|with)\b/i.test(split[2])){
  const left=split[1].trim(),right=split[2].trim();

 }

}

async function lookupLyricsForNote(e){
 const status=$('lyricsLookupStatus'),results=$('lyricsLookupResults');
 if(!status||!results)return;
 const title=String(e&&e.title||'').trim(),artist=String(e&&e.artist||'').trim();
 if(!title){status.textContent='Song title unavailable';return}
 const key=(title+'|'+artist).toLocaleLowerCase();
 function render(items){
  if(!status.isConnected||!results.isConnected)return;
  if(!items||!items.length){status.textContent='No match found';results.innerHTML='';return}
  status.textContent=items.length+' possible match'+(items.length===1?'':'es');
  results.innerHTML=items.slice(0,3).map(function(item){
   const id=Number(item.id);
   if(!Number.isSafeInteger(id)||id<=0)return '';
   return '<a class="lyrics-source-result" href="https://lrclib.net/tracks/'+id+'" target="_blank" rel="noopener noreferrer"><span class="lyrics-source-track"><strong>'+esc(item.trackName||item.name||'Unknown track')+'</strong><span>'+esc(item.artistName||'Artist unavailable')+(item.albumName?' · '+esc(item.albumName):'')+'</span></span><span class="lyrics-source-open">View lyrics ↗</span></a>';
  }).join('');
 }
 if(lrclibLookupCache.has(key)){render(lrclibLookupCache.get(key));return}
 status.textContent='Searching LRCLIB…';
 try{
  const params=new URLSearchParams();params.set('track_name',title);if(artist)params.set('artist_name',artist);
  const response=await fetch('https://lrclib.net/api/search?'+params.toString(),{headers:{'Lrclib-Client':'m}note/1.0 (https://toxinhub.github.io/mnote/)'}});
  if(response.status===429){status.textContent='Lyrics search is temporarily limited. Try again later.';return}
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  const items=Array.isArray(data)?data.filter(function(x){return x&&Number.isSafeInteger(Number(x.id))}):[];
  lrclibLookupCache.set(key,items);render(items);
 }catch(error){status.textContent='Couldn’t reach the lyrics source';results.innerHTML=''}
}
