(()=>{'use strict';const db=window.supabase.createClient('https://ekaxlxudxpkkozbyslub.supabase.co','sb_publishable_sT0mSJ1Rp2J5PeLhBZGJFg_dAeS9xfD');const $=s=>document.querySelector(s);let entries=[],view='all',label='',color='yellow',layout='grid';const colors=['white','yellow','green','blue','pink','purple'];let pins=new Set(JSON.parse(localStorage.getItem('mnote:pinned')||'[]'));function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tags(e){return Array.isArray(e.tags)?e.tags.map(String):String(e.tags||'').split(',').map(x=>x.trim()).filter(Boolean)}function videoId(v=''){try{let u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.pathname==='/watch')return u.searchParams.get('v')||'';if(//(shorts|embed)//.test(u.pathname))return u.pathname.split('/')[2]||''}catch{}return ''}function thumb(id){return 'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg'}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}function modal(id,on){$('#'+id).classList.toggle('open',on);document.body.style.overflow=on?'hidden':''}function palette(target,fn){$(target).innerHTML=colors.map(c=>'<button type="button" title="'+c+'" style="background:'+({white:'#fff',yellow:'#fff8d7',green:'#e6f4ea',blue:'#e8f0fe',pink:'#fce8e6',purple:'#f3e8fd'}[c])+'" data-color="'+c+'"></button>').join('');$(target).onclick=e=>{let b=e.target.closest('[data-color]');if(b)fn(b.dataset.color)}}palette('#composePalette',c=>{color=c;$('#composer').style.background=({white:'#fff',yellow:'#fff8d7',green:'#e6f4ea',blue:'#e8f0fe',pink:'#fce8e6',purple:'#f3e8fd'}[c])});palette('#editPalette',()=>{});async function load(){let {data,error}=await db.from('entries').select('*').eq('status','approved').order('updated_at',{ascending:false}).limit(500);if(error){$('#notes').innerHTML='<div class="empty"><div class="emptyico">♫</div><h3>Could not load your song notes</h3><p>'+esc(error.message)+'</p><button class="primary" id="retry">Try again</button></div>';return}entries=data||[];render()}function card(e,i){let id=videoId(e.song_url||''),ts=tags(e);return '<article class="note" data-id="'+esc(e.id)+'" data-color="'+(colors.includes(e.color)?e.color:colors[i%colors.length+1])+'" tabindex="0"><button class="icon notePin" data-pin="'+esc(e.id)+'" aria-label="Pin note">⌖</button>'+(id?'<a class="video" href="'+esc(e.song_url)+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+thumb(id)+'" alt="'+esc(e.title)+'"><span>▶</span></a>':'')+'<h3 class="noteTitle">'+esc(e.title||'Untitled')+'</h3><div class="noteArtist">'+esc(e.artist||'Unknown artist')+'</div>'+(e.idea?'<p class="noteText">'+esc(e.idea)+'</p>':'')+(e.mood?'<div class="noteMeta"><span class="chip">'+esc(e.mood)+'</span></div>':'')+(ts.length?'<div class="noteMeta">'+ts.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>':'')+'<div class="noteActions"><button class="icon" data-edit="'+esc(e.id)+'" title="Edit note">✎</button><button class="icon" data-copy="'+esc(e.id)+'" title="Copy link">↗</button><button class="icon" data-pin="'+esc(e.id)+'" title="Pin">♧</button></div></article>'}function render(){let list=entries.filter(e=>view==='pinned'?pins.has(String(e.id)):true);if(label)list=list.filter(e=>tags(e).some(t=>t.toLowerCase()===label.toLowerCase()));let q=$('#search').value.trim().toLowerCase();if(q)list=list.filter(e=>[e.title,e.artist,e.idea,e.mood,...tags(e)].join(' ').toLowerCase().includes(q));$('#sectionlabel').textContent=q?'SEARCH RESULTS':label?label.toUpperCase():view==='pinned'?'PINNED':'YOUR SONG NOTES';$('#notes').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><div class="emptyico">♫</div><h3>'+(view==='pinned'?'No pinned notes':q?'No matching notes':'Your song notes live here')+'</h3><p>'+(q?'Try another search.':'Add a song, a memory, or a moment you want to keep.')+'</p></div>';let all=[...new Set(entries.flatMap(tags))].sort((a,b)=>a.localeCompare(b));$('#labels').innerHTML=all.map(t=>'<button class="navitem '+(label===t?'active':'')+'" data-label="'+esc(t)+'"><span class="ico">#</span><span class="navtext">'+esc(t)+'</span></button>').join('');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}function expand(){let c=$('#composer');c.classList.add('expanded');$('#extraFields').classList.remove('hidden');$('#noteBody').classList.remove('hidden');$('#quickTitle').focus()}function collapse(){let c=$('#composer');c.classList.remove('expanded');$('#extraFields').classList.add('hidden');$('#noteBody').classList.add('hidden');$('#quickTitle').value='';$('#quickUrl').value='';$('#quickArtist').value='';$('#quickIdea').value='';$('#quickMood').value='';$('#quickTags').value='';$('#quickStart').value='';color='yellow';$('#composer').style.background='white'}async function saveQuick(){let title=$('#quickTitle').value.trim(),url=$('#quickUrl').value.trim(),id=videoId(url),idea=$('#quickIdea').value.trim();if(!title||!idea){toast('Add a song title and a note first');expand();return}if(url&&!id){toast('Please paste a valid YouTube link');return}let payload={title,artist:$('#quickArtist').value.trim(),mood:$('#quickMood').value.trim()||'Song note',idea,song_url:id?'https://www.youtube.com/watch?v='+id:url,platform:'YouTube',progress:'Idea',tags:$('#quickTags').value.trim(),start_time:$('#quickStart').value.trim(),status:'pending'};let {error}=await db.from('entries').insert(payload);if(error){toast('Could not submit: '+error.message);return}collapse();toast('Submitted for admin approval');}function edit(id){let e=entries.find(x=>String(x.id)===String(id));if(!e)return;$('#editId').value=e.id;$('#editTitle').value=e.title||'';$('#editArtist').value=e.artist||'';$('#editUrl').value=e.song_url||'';$('#editIdea').value=e.idea||'';$('#editMood').value=e.mood||'';$('#editTags').value=tags(e).join(', ');$('#editMoment').value=e.start_time||'';modal('editOverlay',true)}function detail(id){let e=entries.find(x=>String(x.id)===String(id));if(!e)return;let vid=videoId(e.song_url||'');$('#detail').innerHTML='<div class="dialogActions"><span class="spacer"></span><button class="icon" id="detailClose">×</button></div><h2>'+esc(e.title)+'</h2><div class="noteArtist">'+esc(e.artist||'Unknown artist')+'</div>'+(vid?'<a class="detailvideo" href="'+esc(e.song_url)+'" target="_blank" rel="noopener"><img src="'+thumb(vid)+'" alt=""></a>':'')+(e.idea?'<div class="detailsection"><h4>Memory / feeling</h4>'+esc(e.idea)+'</div>':'')+(e.start_time?'<div class="detailsection"><h4>Favorite moment</h4>'+esc(e.start_time)+'</div>':'')+(e.mood?'<div class="detailsection"><h4>Feeling</h4>'+esc(e.mood)+'</div>':'')+(tags(e).length?'<div class="detailsection">'+tags(e).map(t=>'<span class="chip">'+esc(t)+'</span>').join(' ')+'</div>':'')+'<div class="dialogActions"><a class="primary" target="_blank" rel="noopener" href="'+esc(e.song_url||'#')+'">▶ YouTube</a><a class="plainbtn" target="_blank" rel="noopener" href="https://music.youtube.com/watch?v='+encodeURIComponent(vid)+'">YouTube Music</a><button class="plainbtn" id="detailEdit">Edit</button></div>';modal('detailOverlay',true);$('#detailClose').onclick=()=>modal('detailOverlay',false);$('#detailEdit').onclick=()=>{modal('detailOverlay',false);edit(id)}}$('#menu').onclick=()=>$('#sidebar').classList.toggle('slim');$('#search').oninput=render;$('#refresh').onclick=load;$('#expand').onclick=expand;$('#quickTitle').onclick=expand;$('#quickLink').onclick=()=>{expand();$('#quickUrl').focus()};$('#quickColor').onclick=()=>{let ix=colors.indexOf(color);color=colors[(ix+1)%colors.length];$('#composer').style.background=({white:'#fff',yellow:'#fff8d7',green:'#e6f4ea',blue:'#e8f0fe',pink:'#fce8e6',purple:'#f3e8fd'}[color])};$('#closeCompose').onclick=collapse;$('#quickSave').onclick=saveQuick;$('#mobileAdd').onclick=expand;$('#mobileLabe
