<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="A simple journal for songs, musical moments and creative ideas.">
<title>mnote — Keep the moment</title>
<style>
:root{color-scheme:light;--bg:#fff;--paper:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--soft:#f8f9fa;--yellow:#fbbc04;--yellow-soft:#fff7d6;--blue:#1a73e8;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);background:var(--bg);font:14px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;min-height:72px;padding:12px clamp(14px,3vw,36px);background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #e8eaed}
.brand{display:flex;align-items:center;gap:10px;min-width:190px;text-decoration:none}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--yellow);color:#5f4811;font-size:23px}
.brand-name{font-size:21px;letter-spacing:-.7px;font-weight:600;color:#5f6368}
.search{position:relative;flex:1;max-width:720px;margin:auto}
.search span{position:absolute;left:15px;top:10px;color:var(--muted);font-size:19px}
.search input{width:100%;height:44px;padding:0 16px 0 44px;border:1px solid transparent;border-radius:9px;background:#f1f3f4;color:var(--text);font-size:15px}
.search input:focus{background:#fff;border-color:#dadce0;outline:none;box-shadow:0 1px 2px #0000000b}
.top-actions{display:flex;align-items:center;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#3c4043;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f8f9fa}.btn.primary{background:#1a73e8;border-color:#1a73e8;color:white}.btn.primary:hover{background:#1765cc}
.page{width:min(1440px,100%);margin:0 auto;padding:24px clamp(12px,2.6vw,34px) 60px}
.capture{display:flex;align-items:center;gap:13px;width:min(600px,100%);min-height:54px;margin:2px auto 30px;padding:12px 17px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);text-align:left;box-shadow:0 1px 2px #0000000a}
.capture:hover{box-shadow:0 2px 7px #00000014}.capture-plus{font-size:23px}.capture strong{display:block;font-size:14px;font-weight:500;color:#5f6368}.capture small{display:block;margin-top:2px;color:#80868b;font-size:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 15px;max-width:1040px}
.section-head h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#80868b;text-transform:uppercase}
.view-toggle{display:flex;gap:3px;padding:3px;border:1px solid #e8eaed;border-radius:8px}.view-toggle button{width:31px;height:28px;border:0;border-radius:5px;background:transparent;color:#5f6368}.view-toggle button.active{background:#f1f3f4;color:#202124}
.notes{max-width:1200px;margin:auto;columns:5 205px;column-gap:14px}
.note{display:inline-block;width:100%;margin:0 0 14px;break-inside:avoid;vertical-align:top;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.note:hover{box-shadow:0 2px 7px #00000018}
.note-body{padding:13px 14px 0}.note-kind{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:#80868b;font-size:10px}
.note-kind .state{color:#188038}
.note-title{margin:0 0 5px;font-size:16px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.artist{margin:0 0 9px;color:var(--muted);font-size:12px}
.note-text{margin:0 0 12px;color:#3c4043;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.note-visual{margin:0 0 12px;padding-top:9px;border-top:1px solid #f1f3f4;color:#5f6368;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 11px}.tag{padding:3px 7px;border:1px solid #dadce0;border-radius:12px;color:#5f6368;font-size:10px}
.youtube-link{display:block;background:#f1f3f4;overflow:hidden}.youtube-thumb{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.note-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px;margin:0;padding:6px 11px;border-top:1px solid #f1f3f4;color:#80868b;font-size:10px}
.note-footer a,.note-footer button{border:0;background:transparent;padding:2px;color:#5f6368;font-size:12px;text-decoration:none}.note-footer a:hover,.note-footer button:hover{color:var(--blue)}
.notes.list{columns:1;max-width:850px}.notes.list .note{display:block;margin-bottom:10px}.notes.list .note-body{padding:13px 16px 0}.notes.list .youtube-thumb{max-height:200px}
.empty{max-width:560px;margin:35px auto;padding:38px 20px;text-align:center;color:#5f6368}.empty-icon{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 13px;border-radius:50%;background:#fff7d6;color:#8a6d1d;font-size:25px}.empty h2{margin:0 0 6px;color:#3c4043;font-size:17px;font-weight:500}.empty p{margin:0 auto 17px;max-width:350px;font-size:13px}
.footer{margin:44px auto 0;padding-top:14px;border-top:1px solid #f1f3f4;max-width:1040px;color:#9aa0a6;font-size:11px;display:flex;justify-content:space-between;gap:12px}
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:14px;background:#20212466;overflow:auto}.overlay.open{display:flex}
.modal{width:min(560px,100%);max-height:min(92dvh,900px);overflow:auto;border:1px solid #dadce0;border-radius:12px;background:#fff;padding:23px;box-shadow:0 8px 28px #00000024}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:17px}.modal-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.35px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.close{flex:0 0 32px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#5f6368;font-size:24px}.close:hover{background:#f1f3f4}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;align-content:start;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{color:#3c4043;font-size:12px;font-weight:600}
.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid #dadce0;border-radius:7px;background:#fff;padding:10px 11px;color:#202124}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#1a73e8;outline:1px solid #1a73e8}
.form-help{font-size:11px;color:#80868b}.search-song{justify-self:start;padding:6px 0;border:0;background:transparent;color:#1a73e8;font-size:12px;font-weight:600}
.more-details{margin-top:15px;border-top:1px solid #f1f3f4;padding-top:12px}.more-details summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;list-style:none;color:#3c4043;font-size:13px}.more-details summary::-webkit-details-marker{display:none}.more-details summary small{display:block;margin-top:3px;color:#80868b;font-size:11px;font-weight:400}.details-fields{margin-top:14px}.modal-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.modal-actions-right{display:flex;gap:8px}
.toast{position:fixed;z-index:50;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100% - 28px);padding:11px 15px;border-radius:7px;background:#323232;color:white;font-size:13px;transition:opacity .18s,transform .18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.notes{columns:4 190px}.brand{min-width:150px}}
@media(max-width:780px){.topbar{min-height:0;display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px}.brand{min-width:0;gap:8px}.brand-mark{width:34px;height:34px;font-size:21px}.brand-name{font-size:20px}.search{grid-column:1/-1;grid-row:2;width:100%;max-width:none}.search input{height:41px;font-size:14px}.top-actions{grid-column:2;grid-row:1}.admin-link{display:none}.top-actions .btn{min-height:34px;padding:7px 10px;font-size:12px}.page{padding:17px 10px 36px}.capture{margin:0 auto 23px;min-height:51px;padding:10px 13px}.capture small{display:none}.notes{columns:2 150px;column-gap:8px}.note{margin-bottom:8px;border-radius:8px}.note-body{padding:10px 10px 0}.note-kind{font-size:9px;margin-bottom:6px}.note-title{font-size:14px}.artist{font-size:11px;margin-bottom:7px}.note-text{font-size:12px;line-height:1.45;margin-bottom:9px}.note-visual{font-size:11px}.note-tags{gap:4px;margin-bottom:8px}.tag{font-size:9px;padding:3px 6px}.note-footer{padding:5px 8px;font-size:9px}.note-footer a,.note-footer button{font-size:11px}.section-head{margin-bottom:12px;padding:0 2px}.footer{margin-top:30px;font-size:10px}.modal{padding:17px;border-radius:11px;max-height:calc(100dvh - 20px)}.modal-head h2{font-size:19px}.form-grid{grid-template-columns:1fr;gap:11px}.field.full{grid-column:auto}.details-fields{margin-top:12px}.modal-actions{margin-top:16px}.btn{min-height:36px;padding:8px 10px;font-size:12px}}
@media(max-width:360px){.notes{column-gap:6px}.note-body{padding:9px 8px 0}.note-title{font-size:13px}.note-text{font-size:11px}.note-footer{margin:0 -1px;padding-left:6px;padding-right:6px}.top-actions .btn{padding:6px 8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="mnote home"><span class="brand-mark" aria-hidden="true">♫</span><span class="brand-name">mnote</span></a>
  <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search songs, lyrics and ideas" aria-label="Search notes"></label>
  <div class="top-actions"><button class="btn primary" id="new-top" type="button">＋ New note</button><a class="btn admin-link" href="./admin.html">Admin ↗</a></div>
</header>
<main class="page">
  <button class="capture" id="quick-capture" type="button"><span class="capture-plus" aria-hidden="true">＋</span><span><strong>Write a note…</strong><small>Save a song, a lyric, a moment or a story idea</small></span></button>
  <div class="section-head"><h1 id="section-title">Your music notes</h1><div class="view-toggle" aria-label="Layout"><button class="active" id="grid-view" type="button" aria-label="Grid view" title="Grid view">▦</button><button id="list-view" type="button" aria-label="List view" title="List view">☰</button></div></div>
  <div class="notes" id="notes" aria-live="polite"></div>
  <footer class="footer"><span>mnote · Keep the moment.</span><span>Public notes appear after admin approval.</span></footer>
</main>
<div class="overlay" id="editor-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <form class="modal" id="song-form">
    <div class="modal-head"><div><h2 id="modal-title">New music note</h2><p>Keep the part you want to remember.</p></div><button type="button" class="close" id="close-modal" aria-label="Close">×</button></div>
    <input type="hidden" id="entry-id">
    <div class="form-grid">
      <div class="field full"><label for="song-name">Song title *</label><input id="song-name" required maxlength="180" placeholder="What was playing?"><button class="search-song" id="google-song-search" type="button">⌕ Search this song on Google ↗</button></div>
      <div class="field full"><label for="idea-note">Lyric, moment or idea *</label><textarea id="idea-note" required maxlength="5000" placeholder="Write down the lyric, the moment, what you felt, or the story you imagined…"></textarea></div>
    </div>
    <details class="more-details"><summary><span><strong>More details</strong><small>Artist, song link, timestamp and visual idea</small></span><span aria-hidden="true">⌄</span></summary>
      <div class="form-grid details-fields">
        <div class="field"><label for="artist">Artist</label><input id="artist" maxlength="180" placeholder="Artist or band"></div>
        <div class="field"><label for="start-time">Timestamp</label><input id="start-time" maxlength="24" placeholder="01:42"></div>
        <div class="field full"><label for="song-url">Song link</label><input id="song-url" type="url" placeholder="https://youtube.com/…"><span class="form-help">A YouTube link shows its video thumbnail on your note.</span></div>
        <div class="field"><label for="mood">Mood</label><select id="mood"><option value="">Choose a mood</option><option>Dreamy</option><option>Melancholic</option><option>Romantic</option><option>Peaceful</option><option>Energetic</option><option>Nostalgic</option><option>Mysterious</option><option>Hopeful</option></select></div>
        <div class="field"><label for="platform">Possible use</label><select id="platform"><option value="">Not decided</option><option>Instagram Story</option><option>Facebook Story</option><option>Reel / Short Video</option><option>Post / Caption</option><option>Personal collection</option><option>Other</option></select></div>
        <div class="field full"><label for="visual">Visual idea <span style="font-weight:400;color:#80868b">(optional)</span></label><textarea id="visual" maxlength="2000" placeholder="A scene, photo, colour mood or video idea…" style="min-height:76px"></textarea></div>
        <input id="end-time" type="hidden"><input id="moment-type" type="hidden" value="Music / instrumental"><input id="status" type="hidden" value="Idea"><input id="tags" type="hidden">
      </div>
    </details>
    <div class="modal-actions"><button type="button" class="btn" id="delete-entry" hidden>Delete note</button><div class="modal-actions-right"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary" type="submit">Save note</button></div></div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=> {
'use strict';
const KEY='m}note.entries.v1', LEGACY_KEY='echonote.entries.v1';
const $=s=>document.querySelector(s);
let entries=[],publicEntries=[],query='',layout='grid';
const cloud=window.supabase?.createClient('https://ekaxlxudxpkkozbyslub.supabase.co','sb_publishable_sT0mSJ1Rp2J5PeLhBZGJFg_dAeS9xfX');
function load(){try{let raw=localStorage.getItem(KEY);if(raw===null){raw=localStorage.getItem(LEGACY_KEY);if(raw!==null)localStorage.setItem(KEY,raw)}const data=JSON.parse(raw||'[]');entries=Array.isArray(data)?data:[]}catch{entries=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch{toast('Could not save. Browser storage may be full.');return false}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function youtubeId(value){try{const u=new URL(value);if(u.hostname==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(/(^|\.)youtube\.com$/i.test(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);return m?m[1]:''}}catch{}return ''}
function youtubeThumb(value){const id=youtubeId(value);return id?'https://img.youtube.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg':''}
function dateLabel(value){try{return new Date(value).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch{return 'Recently'}}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function googleUrl(e){return 'https://www.google.com/search?q='+encodeURIComponent([e.song,e.artist].filter(Boolean).join(' '))}
function filtered(){const all=[...publicEntries,...entries];return all.filter(e=>[e.song,e.artist,e.idea,e.visual,e.tags,e.mood,e.platform,e.momentType].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0))}
function card(e){const isPublic=!!e._public,thumb=youtubeThumb(e.url),tags=String(e.tags||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,3);return '<article class="note"><div class="note-body"><div class="note-kind"><span>'+ (isPublic?'<span class="state">● Public</span>':'♫ Music note')+'</span>'+(e.start?'<span>'+esc(e.start)+'</span>':'')+'</div><button class="note-open" data-edit="'+esc(e.id)+'" type="button" style="display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left"><h2 class="note-title">'+esc(e.song||'Untitled note')+'</h2>'+(e.artist?'<p class="artist">'+esc(e.artist)+'</p>':'')+'<p class="note-text">'+esc(e.idea||'')+'</p>'+(e.visual?'<p class="note-visual">▧ '+esc(e.visual)+'</p>':'')+'</button><div class="note-tags">'+(e.mood?'<span class="tag">'+esc(e.mood)+'</span>':'')+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div>'+(thumb?'<a class="youtube-link" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer" aria-label="Open song on YouTube"><img class="youtube-thumb" src="'+esc(thumb)+'" alt="YouTube thumbnail" loading="lazy" onerror="this.closest(\'a\').remove()"></a>':'')+'<div class="note-footer"><span>'+esc(dateLabel(e.createdAt))+'</span><span>'+(e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer" aria-label="Open song link">↗ Song</a>':'')+' <a href="'+esc(googleUrl(e))+'" target="_blank" rel="noopener noreferrer">⌕ Google</a>'+(isPublic?'':' <button type="button" data-edit="'+esc(e.id)+'" aria-label="Edit note">Edit</button>')+'</span></div></article>'}
function render(){const list=filtered(),el=$('#notes');el.classList.toggle('list',layout==='list');$('#grid-view').classList.toggle('active',layout==='grid');$('#list-view').classList.toggle('active',layout==='list');$('#section-title').textContent=query?'Search results':'Your music notes';if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">♫</div><h2>'+(query?'No matching notes':'Keep the moment')+'</h2><p>'+(query?'Try another song title, lyric or idea.':'Save a song, a lyric, a timestamp or the idea it gave you.')+'</p><button class="btn primary" data-new type="button">＋ Create a note</button></div>';return}el.innerHTML=list.map(card).join('')}
async function loadPublicEntries(){if(!cloud)return;try{const {data,error}=await cloud.from('entries').select('id,title,artist,idea,song_url,start_time,end_time,moment_type,mood,platform,progress,tags,visual,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(300);if(error)throw error;publicEntries=(data||[]).map(r=>({id:r.id,song:r.title,artist:r.artist,idea:r.idea,url:r.song_url,start:r.start_time,end:r.end_time,momentType:r.moment_type,mood:r.mood,platform:r.platform,status:r.progress,tags:r.tags,visual:r.visual,createdAt:r.created_at,_public:true}));render()}catch(err){console.warn('Could not load public notes',err);toast('Public notes could not load. Check your connection.')}}
function openEditor(id){const e=entries.find(x=>String(x.id)===String(id));$('#song-form').reset();$('#entry-id').value=e?.id||'';$('#modal-title').textContent=e?'Edit music note':'New music note';$('#delete-entry').hidden=!e;$('#song-name').value=e?.song||'';$('#artist').value=e?.artist||'';$('#song-url').value=e?.url||'';$('#start-time').value=e?.start||'';$('#end-time').value=e?.end||'';$('#moment-type').value=e?.momentType||'Music / instrumental';$('#idea-note').value=e?.idea||'';$('#mood').value=e?.mood||'';$('#platform').value=e?.platform||'';$('#status').value=e?.status||'Idea';$('#tags').value=e?.tags||'';$('#visual').value=e?.visual||'';$('#editor-overlay').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('#song-name').focus(),60)}
function closeEditor(){$('#editor-overlay').classList.remove('open');document.body.style.overflow=''}
async function save(event){event.preventDefault();const id=$('#entry-id').value,old=entries.find(x=>String(x.id)===String(id));const row={id:id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),song:$('#song-name').value.trim(),artist:$('#artist').value.trim(),url:safeUrl($('#song-url').value.trim()),start:$('#start-time').value.trim(),end:$('#end-time').value.trim(),momentType:$('#moment-type').value||'Music / instrumental',idea:$('#idea-note').value.trim(),mood:$('#mood').value,platform:$('#platform').value,status:$('#status').value||'Idea',tags:$('#tags').value.trim(),visual:$('#visual').value.trim(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(!row.song||!row.idea){toast('Add a song title and your note first.');return}if(old){entries=entries.map(x=>String(x.id)===String(id)?row:x);if(persist()){closeEditor();render();toast('Note updated on this device.')}return}if(!cloud){toast('Online submissions are unavailable right now.');return}const submit={title:row.song,artist:row.artist,idea:row.idea,song_url:row.url,start_time:row.start,end_time:row.end,moment_type:row.momentType,mood:row.mood,platform:row.platform,progress:row.status,tags:row.tags,visual:row.visual,status:'pending'};const button=$('#song-form button[type="submit"]');button.disabled=true;button.textContent='Submitting…';try{const result=await cloud.from('entries').insert(submit);if(result.error)throw result.error;closeEditor();toast('Sent for review. It will appear after admin approval.')}catch(err){console.error(err);toast('Submission failed. Please try again.')}finally{button.disabled=false;button.textContent='Save note'}}
function deleteCurrent(){const id=$('#entry-id').value;if(!id)return;if(!confirm('Delete this private note from this browser?'))return;entries=entries.filter(x=>String(x.id)!==String(id));if(persist()){closeEditor();render();toast('Note deleted.')}}
document.addEventListener('click',event=>{const edit=event.target.closest('[data-edit]');if(edit){const entry=entries.find(x=>String(x.id)===String(edit.dataset.edit));if(entry){openEditor(entry.id)}return}if(event.target.closest('[data-new]')||event.target.closest('#new-top')||event.target.closest('#quick-capture')){openEditor();return}});
$('#search').addEventListener('input',event=>{query=event.target.value.trim();render()});
$('#google-song-search').addEventListener('click',()=>{const title=$('#song-name').value.trim(),artist=$('#artist').value.trim();if(!title){$('#song-name').focus();toast('Enter the song title first.');return}window.open('https://www.google.com/search?q='+encodeURIComponent([title,artist].filter(Boolean).join(' ')),'_blank','noopener,noreferrer')});
$('#grid-view').addEventListener('click',()=>{layout='grid';render()});$('#list-view').addEventListener('click',()=>{layout='list';render()});
$('#song-form').addEventListener('submit',save);$('#close-modal').addEventListener('click',closeEditor);$('#cancel-modal').addEventListener('click',closeEditor);$('#delete-entry').addEventListener('click',deleteCurrent);$('#editor-overlay').addEventListener('click',event=>{if(event.target===$('#editor-overlay'))closeEditor()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeEditor();if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('#search').focus()}});
load();render();loadPublicEntries();
})();
</script>
</body>
