<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SurKhata Admin</title><style>
:root{color-scheme:light;--page:#fff;--surface:#fff;--soft:#f8f9fa;--soft-2:#f1f3f4;--ink:#202124;--muted:#5f6368;--line:#dadce0;--accent:#fbbc04;--accent-soft:#feefc3;--focus:#1a73e8;--green:#137333;--green-bg:#e6f4ea;--red:#b3261e;--red-bg:#fce8e6;--radius:12px;--shadow:0 1px 3px #3c40431a;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--page);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font:14px/1.55 "Google Sans",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
.wrap{width:min(1120px,100%);margin:0 auto;padding:20px 24px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px;padding:0 0 15px;border-bottom:1px solid var(--line)}
.top>b{display:flex;align-items:center;gap:9px;font-size:20px;line-height:1.2;letter-spacing:-.045em;font-weight:600}
.top>b:before{content:"♫";display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);color:#5f4300;font-size:19px;font-weight:700;letter-spacing:0}
.top small{display:inline-flex;align-items:center;margin-left:2px;padding:4px 7px;border:1px solid #f3d77b;border-radius:5px;background:#fff8df;color:#765500;font-size:9px;letter-spacing:.11em;vertical-align:middle}
.panel,.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.login{width:min(440px,100%);margin:clamp(34px,8vh,76px) auto 0;padding:clamp(22px,4vw,32px);border-color:var(--line);background:var(--surface);box-shadow:0 3px 16px #3c40430d}
.login h1{margin:0 0 8px;font-size:clamp(25px,4vw,30px);line-height:1.22;letter-spacing:-.045em;font-weight:600}
.login>p{margin:0 0 24px;color:var(--muted);font-size:13px}
.login form{margin:0}
.login hr{border:0!important;border-top:1px solid var(--line)!important;margin:24px 0!important}
.login h2{font-size:16px!important;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px;line-height:1.3;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--soft-2);border-color:#bdc1c6}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.65;cursor:wait}
.primary{background:var(--accent);border-color:var(--accent);color:#202124}
.primary:hover{background:#f9ab00;border-color:#f9ab00}
.good{background:var(--green-bg);border-color:#ceead6;color:var(--green)}
.good:hover{background:#ceead6;border-color:#b7dfc3}
.bad{background:var(--red-bg);border-color:#f6c7c2;color:var(--red)}
.bad:hover{background:#f8d7d4;border-color:#eeb4ae}
.muted{color:var(--muted)}
.field{display:grid;gap:6px;margin:14px 0}
.field label{color:var(--ink);font-size:12px;font-weight:600}
.field input,.field textarea,.field select{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
.field input::placeholder,.field textarea::placeholder{color:#80868b}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#d6a400;box-shadow:0 0 0 2px #fbbc042e}
.field input:-webkit-autofill{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 1000px #fff inset}
.field textarea{min-height:100px;resize:vertical}
.field small{font-size:11px;line-height:1.5}
#login-form .primary{width:100%;min-height:43px;margin-top:4px;font-size:13px}
.notice{margin:14px 0;padding:12px 14px;border:1px solid #ceead6;border-radius:9px;background:var(--green-bg);color:var(--green);font-size:12px;line-height:1.55;overflow-wrap:anywhere}
.error{border-color:#f6c7c2!important;background:var(--red-bg)!important;color:var(--red)!important}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:28px 0 20px}
.head h1{margin:4px 0 5px;font-size:clamp(26px,4vw,32px);line-height:1.2;letter-spacing:-.045em;font-weight:600}
.head .muted{font-size:12px}
.head>div>.muted:first-child{font-size:10px;letter-spacing:.13em;font-weight:700;color:#8a6500}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 16px;padding:4px 0 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 13px;border-radius:8px;white-space:nowrap;font-size:12px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.tab:hover{border-color:#bdc1c6;color:var(--ink);background:var(--soft)}
.tab.active{background:var(--accent-soft);border-color:#f3d77b;color:#5f4300}
.list{display:grid;gap:10px}
.entry{display:flex;align-items:flex-start;gap:18px;padding:17px 18px;border-radius:10px}
.entry>div:first-child{flex:1;min-width:0}
.entry h3{margin:8px 0 4px;font-size:16px;line-height:1.4;letter-spacing:-.02em;overflow-wrap:anywhere}
.entry p{margin:11px 0;color:#3c4043;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:13px}
.entry .muted{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.entry a{display:inline-flex;margin-top:3px;color:#1a73e8;font-size:12px;font-weight:500}
.entry a:hover{text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;align-self:flex-start}
.badge{display:inline-flex;align-items:center;border:1px solid #f3d77b;border-radius:5px;padding:4px 7px;background:#fff8df;color:#765500;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.empty{text-align:center;padding:42px 20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--surface);font-size:13px}
.modal{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;padding:16px;background:#20212466;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal.open{display:flex}
.modal form{width:min(650px,100%);max-height:min(92dvh,900px);overflow:auto;overscroll-behavior:contain;padding:clamp(18px,3vw,26px);border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 12px 36px #20212430}
.modal h2{margin:0 0 14px;font-size:20px;line-height:1.3;letter-spacing:-.035em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.full{grid-column:1/-1}
#cancel{margin-right:auto}
@media(min-width:900px){.wrap{padding-top:24px}.login{margin-top:8vh}}
@media(max-width:680px){
 .wrap{padding:13px 12px calc(28px + var(--safe))}
 .top{min-height:47px;padding-bottom:12px}
 .top>b{font-size:18px}
 .top>b:before{width:30px;height:30px;border-radius:9px}
 .top .btn{min-height:35px;padding:8px 10px}
 .login{margin-top:28px;padding:22px 18px;border-radius:12px}
 .head{align-items:flex-start;flex-direction:row;gap:12px;margin:24px 0 17px}
 .head h1{font-size:26px}
 .head #signout{flex:0 0 auto}
 .tabs{margin-bottom:12px}
 .entry{display:block;padding:15px;border-radius:10px}
 .entry h3{font-size:16px}
 .entry p{margin:10px 0}
 .actions{justify-content:flex-start;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
 .actions .btn{min-height:36px;padding:8px 10px}
 .grid{grid-template-columns:1fr;gap:0}
 .full{grid-column:auto}
 .modal{align-items:flex-end;padding:0}
 .modal form{width:100%;max-height:calc(94dvh - var(--safe));border-radius:14px 14px 0 0;padding:20px 16px calc(16px + var(--safe))}
}
@media(max-width:420px){
 .head{align-items:flex-start}
 .head h1{font-size:24px}
 .head .muted{max-width:235px}
 .head #signout{padding:8px 10px}
 .entry h3{font-size:15px}
 .actions{gap:6px}
 .actions .btn{padding:8px 9px;font-size:11px}
 .modal form{max-height:calc(94dvh - var(--safe))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style></head><body><div class="wrap"><header class="top"><b>SurKhata <small class="muted">ADMIN</small></b><a href="./" class="btn">← Public site</a></header><section id="login" class="panel login"><h1>Admin sign in</h1><p class="muted">Use the authorised mnote admin account.</p><form id="login-form"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit" class="btn primary" style="width:100%">Sign in</button></form><div id="login-msg" class="notice hidden"></div></section><section id="workspace" class="hidden"><div class="head"><div><div class="muted">CONTENT CONTROL</div><h1>Review the library.</h1><div class="muted">Submissions stay private until approved.</div></div><button class="btn" id="signout">Sign out</button></div><div id="msg" class="notice hidden"></div><div class="tabs"><button class="tab active" data-status="pending">Pending</button><button class="tab" data-status="approved">Approved library</button><button class="tab" data-status="rejected">Rejected</button></div><div id="list" class="list"></div></section></div><div id="modal" class="modal"><form id="edit-form"><h2>Edit entry</h2><input type="hidden" id="edit-id"><div class="grid"><div class="field full"><label>Title *</label><input id="f-title" maxlength="180" required></div><div class="field"><label>Artist</label><input id="f-artist" maxlength="180"></div><div class="field"><label>Mood</label><input id="f-mood" maxlength="60"></div><div class="field full"><label>Idea / memory *</label><textarea id="f-idea" maxlength="5000" required></textarea></div><div class="field full"><label>Song URL</label><input id="f-url" type="url" maxlength="1000"></div><div class="field"><label>Moment start</label><input id="f-start" maxlength="40"></div><div class="field"><label>Moment end</label><input id="f-end" maxlength="40"></div><div class="field"><label>Platform</label><input id="f-platform" maxlength="80"></div><div class="field"><label>Progress</label><select id="f-progress"><option>Idea</option><option>In progress</option><option>Created</option></select></div><div class="field full"><label>Tags</label><input id="f-tags" maxlength="500"></div><div class="field full"><label>Visual idea</label><textarea id="f-visual" maxlength="2000"></textarea></div></div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save changes</button></div></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script>
(()=>{if(!window.supabase||typeof window.supabase.createClient!=="function"){const e=document.querySelector("#login-msg");e.textContent="The authentication library could not load. Check your connection, reload the page, or try again.";e.classList.remove("hidden");e.classList.add("error");return}const db=window.supabase.createClient('https://ekaxlxudxpkkozbyslub.supabase.co','sb_publishable_sT0mSJ1Rp2J5PeLhBZGJFg_dAeS9xfX'),$=s=>document.querySelector(s);let status='pending',rows=[];function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(id,t,bad=false){const e=$(id);e.textContent=t;e.classList.remove('hidden','error');if(bad)e.classList.add('error')}async function verify(u){const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(error){await db.auth.signOut();$('#login').classList.remove('hidden');$('#workspace').classList.add('hidden');msg('#login-msg','Signed in, but admin access could not be verified: '+error.message,true);return}if(!data){await db.auth.signOut();$('#login').classList.remove('hidden');$('#workspace').classList.add('hidden');msg('#login-msg','This account is signed in but is not authorised as an admin. Ask the project owner to grant admin access.',true);return}$('#login').classList.add('hidden');$('#workspace').classList.remove('hidden');await load()}async function load(){const {data,error}=await db.from('entries').select('*').order('updated_at',{ascending:false}).limit(500);if(error){msg('#msg','Could not load entries: '+error.message,true);return}rows=data||[];render()}function render(){const list=rows.filter(r=>r.status===status);$('#list').innerHTML=list.length?list.map(r=>'<article class="entry"><div><span class="badge">'+esc(r.status)+'</span><h3>'+esc(r.title)+'</h3><div class="muted">'+esc(r.artist||'Artist not added')+' · '+esc(r.mood)+'</div><p>'+esc(r.idea)+'</p>'+(r.song_url?'<a href="'+esc(r.song_url)+'" target="_blank" rel="noopener noreferrer">Open song ↗</a>':'')+'</div><div class="actions">'+(r.status==='pending'?'<button class="btn good" data-act="approve" data-id="'+r.id+'">Approve</button><button class="btn bad" data-act="reject" data-id="'+r.id+'">Reject</button>':'')+'<button class="btn" data-act="edit" data-id="'+r.id+'">Edit</button><button class="btn bad" data-act="delete" data-id="'+r.id+'">Delete</button></div></article>').join(''):'<div class="empty">No '+status+' entries right now.</div>'}async function statusUpdate(id,next){const {error}=await db.from('entries').update({status:next}).eq('id',id);if(error){msg('#msg','Action failed: '+error.message,true);return}msg('#msg','Entry marked '+next+'.');await load()}function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;$('#edit-id').value=id;for(const [k,v] of Object.entries({title:r.title,artist:r.artist,mood:r.mood,idea:r.idea,url:r.song_url,start:r.start_time,end:r.end_time,platform:r.platform,progress:r.progress,tags:r.tags,visual:r.visual}))$('#f-'+k).value=v||'';$('#modal').classList.add('open')}$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const form=$('#login-form'),submit=form.querySelector('button[type="submit"]');if(submit){submit.disabled=true;submit.textContent='Signing in…'}try{const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){msg('#login-msg','Sign in failed: '+error.message,true);return}if(!data.user){msg('#login-msg','Sign in failed: Supabase returned no user. Please try again.',true);return}await verify(data.user)}catch(err){msg('#login-msg','Could not reach the authentication service: '+(err&&err.message?err.message:'Unknown network error'),true)}finally{if(submit){submit.disabled=false;submit.textContent='Sign in'}}});
$('#signout').addEventListener('click',async()=>{await db.auth.signOut();$('#workspace').classList.add('hidden');$('#login').classList.remove('hidden')});document.addEventListener('click',async e=>{const tab=e.target.closest('[data-status]');if(tab){status=tab.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x===tab));render();return}const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;if(b.dataset.act==='approve')await statusUpdate(id,'approved');else if(b.dataset.act==='reject')await statusUpdate(id,'rejected');else if(b.dataset.act==='edit')edit(id);else if(b.dataset.act==='delete'&&confirm('Delete this entry permanently?')){const {error}=await db.from('entries').delete().eq('id',id);if(error)msg('#msg','Delete failed: '+error.message,true);else{msg('#msg','Entry deleted.');await load()}}});$('#edit-form').addEventListener('submit',async e=>{e.preventDefault();const p={title:$('#f-title').value.trim(),artist:$('#f-artist').value.trim(),mood:$('#f-mood').value.trim()||'Dreamy',idea:$('#f-idea').value.trim(),song_url:$('#f-url').value.trim(),start_time:$('#f-start').value.trim(),end_time:$('#f-end').value.trim(),platform:$('#f-platform').value.trim()||'Personal collection',progress:$('#f-progress').value,tags:$('#f-tags').value.trim(),visual:$('#f-visual').value.trim()};const {error}=await db.from('entries').update(p).eq('id',$('#edit-id').value);if(error){msg('#msg','Save failed: '+error.message,true);return}$('#modal').classList.remove('open');msg('#msg','Entry updated.');await load()});$('#cancel').addEventListener('click',()=>$('#modal').classList.remove('open'));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')});db.auth.getSession().then(({data})=>{if(data.session)verify(data.session.user)});db.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){$('#workspace').classList.add('hidden');$('#login').classList.remove('hidden')}})})();
</script></body></html>
